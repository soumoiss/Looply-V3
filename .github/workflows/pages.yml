name: Deploy Looply V3 to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_run:
    workflows: ["Verify Looply"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: looply-v3-pages
  cancel-in-progress: true

jobs:
  build:
    # Run releases on main; only publish successfully verified migration commits.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'migration/import-source-20261025' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # The V3 app lives on the isolated migration branch until release gates pass.
      # This avoids accidentally publishing main's status-only README.
      - name: Check out audited V3 application
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'migration/import-source-20261025' }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install pinned pnpm
        run: npm install --global pnpm@10.34.8
      - name: Install project dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests and build public site
        run: pnpm test
      - name: Verify project-relative assets and public-only output
        run: |
          test -s dist/index.html
          test -s dist/login.html
          test -s dist/home.html
          test -s dist/chat.html
          test -s dist/assets/vendor/neon-js.js
          test -f dist/.nojekyll
          grep -q '../assets/vendor/neon-js.js' dist/src/supabase.js
          ! grep -Eq 'supabase\\.co|service_role|DATABASE_URL|S3_SECRET' dist/config.js
      - name: Check that Pages is enabled for GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GITHUB_TOKEN cannot create the initial Pages site. Do not mask a missing site.
          if ! source_type="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type' 2>/dev/null)"; then
            echo "::error title=Enable GitHub Pages::Repository Pages is not enabled or accessible. Open Settings > Pages > Build and deployment > Source, select GitHub Actions, and rerun this workflow."
            exit 1
          fi
          if [ "${source_type}" != "workflow" ]; then
            echo "::error title=Select GitHub Actions as Pages source::Open Settings > Pages > Build and deployment > Source and select GitHub Actions."
            exit 1
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload approved build
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish Looply V3
        id: deployment
        uses: actions/deploy-pages@v5
