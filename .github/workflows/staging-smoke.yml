name: Looply V3 staging smoke tests
on:
  push:
    branches:
      - migration/import-source-20261025
    paths:
      - .github/workflows/staging-smoke.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-and-security:
    if: github.ref == 'refs/heads/migration/import-source-20261025'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and test original UI plus staging probe
        run: npm test
      - name: Confirm no production URL was changed
        run: |
          grep -F 'qixocgetiwlrsbadpbvh.supabase.co' config.js
          test -f backend/neon/functions/staginghealth/index.mjs
