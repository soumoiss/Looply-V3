<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Recuperar acesso — Looply V3</title>
<script>
window.__looplyResetToken = new URLSearchParams(location.search).get("token");
if (location.search) history.replaceState(null, "", location.pathname);
</script>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#29252f;background:#f5f0fa}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
main{width:min(100%,410px);background:#fff;padding:clamp(24px,6vw,42px);border-radius:28px;box-shadow:0 12px 36px #61248c20}
h1{font-family:Georgia,serif;color:#7010b0;margin:0 0 12px;font-size:34px}
p{line-height:1.5}label{display:block;font-weight:600;margin:18px 0 6px}
input{width:100%;font:inherit;padding:13px 14px;border:1px solid #d6c7e6;border-radius:14px;background:#faf7fc}
button{width:100%;font:inherit;font-weight:700;background:#7010b0;color:white;border:0;border-radius:28px;padding:15px;margin-top:20px;cursor:pointer}
button:disabled{opacity:.65}a{color:#7010b0;text-underline-offset:3px}
#message{min-height:2.8em}#message[role=alert]{color:#81231f}
[hidden]{display:none!important}input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #20b99a;outline-offset:2px}
</style>
</head>
<body><main>
<h1>Looply V3</h1>
<p>Recupere o acesso à sua conta no Neon. Você pode escolher novamente sua senha antiga, desde que seja o titular do e-mail cadastrado.</p>
<form id="request">
<label for="email">E-mail cadastrado no V3</label>
<input id="email" name="email" type="email" required autocomplete="email">
<button type="submit">Enviar recuperação por e-mail</button>
</form>
<form id="complete" hidden>
<label for="password">Defina sua senha</label>
<input id="password" name="password" type="password" minlength="8" maxlength="128" required autocomplete="new-password">
<label for="confirmation">Confirme a senha</label>
<input id="confirmation" name="confirmation" type="password" minlength="8" maxlength="128" required autocomplete="new-password">
<button type="submit">Salvar senha e acessar</button>
</form>
<p id="message" aria-live="polite" role="status"></p>
<a href="login.html">Voltar ao login</a>
</main>
<script>
(() => {
  const base = "https://ep-fancy-smoke-b7d6t1s6.neonauth.c-13.us-east-1.aws.neon.tech/neondb/auth";
  const token = window.__looplyResetToken;
  delete window.__looplyResetToken;
  const message = document.getElementById("message");
  const requestForm = document.getElementById("request");
  const completeForm = document.getElementById("complete");
  const show = (text,error=false) => {message.textContent=text;message.setAttribute("role",error?"alert":"status");};
  async function post(path,body) {
    const response = await fetch(base+"/"+path,{method:"POST",headers:{"content-type":"application/json","accept":"application/json"},body:JSON.stringify(body),credentials:"include",redirect:"error"});
    if(!response.ok) throw new Error("request_failed");
  }
  if(token){requestForm.hidden=true;completeForm.hidden=false;}
  requestForm.addEventListener("submit",async event=>{
    event.preventDefault();
    const email=document.getElementById("email").value.trim().toLowerCase();
    const button=requestForm.querySelector("button");button.disabled=true;
    try{
      await post("request-password-reset",{email,redirectTo:new URL("recuperar.html",location.href).href});
      show("Se houver uma conta Neon com esse e-mail, você receberá uma mensagem de recuperação. Verifique também o spam.");
    }catch{show("Não foi possível solicitar a recuperação pelo Neon. Confirme sua conexão ou peça a ativação da conta ao administrador.",true);}
    finally{button.disabled=false;}
  });
  completeForm.addEventListener("submit",async event=>{
    event.preventDefault();
    const password=document.getElementById("password").value;
    const confirmation=document.getElementById("confirmation").value;
    if(password!==confirmation){show("As senhas não coincidem.",true);return;}
    const button=completeForm.querySelector("button");button.disabled=true;
    try{
      await post("reset-password",{token,newPassword:password});
      completeForm.hidden=true;
      show("Senha salva no Neon. Entre com seu e-mail e esta senha na página de login.");
    }catch{show("O link pode ter expirado ou o Neon recusou a alteração. Solicite um novo e-mail de recuperação.",true);}
    finally{button.disabled=false;}
  });
})();
</script>
</body></html>
